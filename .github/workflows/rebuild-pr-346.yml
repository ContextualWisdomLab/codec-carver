name: Rebuild PR 346 from current main

on:
  push:
    branches:
      - bolt/sqlite-wal-optimization-2694893133971723124

permissions:
  contents: write

concurrency:
  group: rebuild-pr-346-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: bolt/sqlite-wal-optimization-2694893133971723124

      - name: Rebuild a minimal branch from current main
        env:
          TARGET_BRANCH: bolt/sqlite-wal-optimization-2694893133971723124
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          job_path = Path("job_store.py")
          job_text = job_path.read_text(encoding="utf-8")
          old_init = '''        with self._connect() as conn:
            conn.execute(_SCHEMA)
'''
          new_init = '''        with self._connect() as conn:
            conn.execute("PRAGMA journal_mode=WAL")
            conn.execute(_SCHEMA)
'''
          if job_text.count(old_init) != 1:
              raise SystemExit("could not locate JobStore initialization")
          job_text = job_text.replace(old_init, new_init, 1)
          old_job_connect = '''        conn = sqlite3.connect(self._db_path, timeout=30.0)
        try:
            conn.row_factory = sqlite3.Row
            conn.execute("PRAGMA journal_mode=WAL")
            yield conn
'''
          new_job_connect = '''        conn = sqlite3.connect(self._db_path, timeout=30.0)
        try:
            conn.row_factory = sqlite3.Row
            yield conn
'''
          if job_text.count(old_job_connect) != 1:
              raise SystemExit("could not locate JobStore per-connection WAL statement")
          job_text = job_text.replace(old_job_connect, new_job_connect, 1)
          job_text = job_text.replace(
              '        """Open a new WAL-mode connection to the underlying database.\n',
              '        """Open a new connection to the WAL-initialized database.\n',
              1,
          )
          job_path.write_text(job_text, encoding="utf-8")

          usage_path = Path("usage_metering.py")
          usage_text = usage_path.read_text(encoding="utf-8")
          old_usage_init = '''        with closing(self._connect()) as conn:
            with conn:
                conn.execute(_SCHEMA)
'''
          new_usage_init = '''        with closing(self._connect()) as conn:
            with conn:
                conn.execute("PRAGMA journal_mode=WAL")
                conn.execute(_SCHEMA)
'''
          if usage_text.count(old_usage_init) != 1:
              raise SystemExit("could not locate UsageStore initialization")
          usage_text = usage_text.replace(old_usage_init, new_usage_init, 1)
          old_usage_connect = '''        conn = sqlite3.connect(self._db_path, timeout=30.0)
        conn.execute("PRAGMA journal_mode=WAL")
        return conn
'''
          new_usage_connect = '''        return sqlite3.connect(self._db_path, timeout=30.0)
'''
          if usage_text.count(old_usage_connect) != 1:
              raise SystemExit("could not locate UsageStore per-connection WAL statement")
          usage_text = usage_text.replace(old_usage_connect, new_usage_connect, 1)
          usage_text = usage_text.replace(
              '        """Open a new short-lived connection with WAL mode enabled.\n',
              '        """Open a new short-lived connection to the WAL-initialized database.\n',
              1,
          )
          usage_path.write_text(usage_text, encoding="utf-8")

          job_tests_path = Path("tests/test_job_store.py")
          job_tests = job_tests_path.read_text(encoding="utf-8")
          if "import sqlite3\n" not in job_tests:
              job_tests = job_tests.replace("import os\n", "import os\nimport sqlite3\n", 1)
          if "from unittest.mock import patch\n" not in job_tests:
              job_tests = job_tests.replace("import unittest\n", "import unittest\nfrom unittest.mock import patch\n", 1)
          anchor = '\n\nif __name__ == "__main__":\n'
          job_class = '''

class JobStoreWalInitializationTests(unittest.TestCase):
    """WAL is persisted once and not renegotiated on every operation."""

    def test_initialization_persists_wal_mode(self) -> None:
        """A fresh independent connection must observe WAL mode."""

        with tempfile.TemporaryDirectory() as tmpdir:
            db_path = Path(tmpdir) / "jobs.db"
            JobStore(str(db_path))
            with sqlite3.connect(db_path) as connection:
                mode = connection.execute("PRAGMA journal_mode").fetchone()[0]
        self.assertEqual(mode.lower(), "wal")

    def test_get_does_not_repeat_journal_mode_pragma(self) -> None:
        """A normal short-lived connection must not renegotiate journal mode."""

        with tempfile.TemporaryDirectory() as tmpdir:
            db_path = Path(tmpdir) / "jobs.db"
            store = JobStore(str(db_path))
            statements: list[str] = []
            real_connect = sqlite3.connect

            def traced_connect(*args, **kwargs):
                connection = real_connect(*args, **kwargs)
                connection.set_trace_callback(statements.append)
                return connection

            with patch("job_store.sqlite3.connect", side_effect=traced_connect):
                self.assertIsNone(store.get("missing-job"))

        self.assertFalse(
            any("journal_mode" in statement.lower() for statement in statements),
            statements,
        )
'''
          if job_tests.count(anchor) != 1:
              raise SystemExit("could not locate JobStore test footer")
          job_tests_path.write_text(job_tests.replace(anchor, job_class + anchor, 1), encoding="utf-8")

          usage_tests_path = Path("tests/test_usage_metering.py")
          usage_tests = usage_tests_path.read_text(encoding="utf-8")
          if "import sqlite3\n" not in usage_tests:
              usage_tests = usage_tests.replace("import tempfile\n", "import sqlite3\nimport tempfile\n", 1)
          if "from unittest.mock import patch\n" not in usage_tests:
              usage_tests = usage_tests.replace("import unittest\n", "import unittest\nfrom unittest.mock import patch\n", 1)
          usage_class = '''

class UsageStoreWalInitializationTests(unittest.TestCase):
    """WAL is persisted once and omitted from ordinary connections."""

    def test_initialization_persists_wal_mode(self) -> None:
        """A fresh independent connection must observe WAL mode."""

        with tempfile.TemporaryDirectory() as tmpdir:
            db_path = Path(tmpdir) / "usage.db"
            UsageStore(db_path)
            with sqlite3.connect(db_path) as connection:
                mode = connection.execute("PRAGMA journal_mode").fetchone()[0]
        self.assertEqual(mode.lower(), "wal")

    def test_usage_does_not_repeat_journal_mode_pragma(self) -> None:
        """A normal usage query must not renegotiate journal mode."""

        with tempfile.TemporaryDirectory() as tmpdir:
            db_path = Path(tmpdir) / "usage.db"
            store = UsageStore(db_path)
            statements: list[str] = []
            real_connect = sqlite3.connect

            def traced_connect(*args, **kwargs):
                connection = real_connect(*args, **kwargs)
                connection.set_trace_callback(statements.append)
                return connection

            with patch("usage_metering.sqlite3.connect", side_effect=traced_connect):
                self.assertEqual(store.usage("missing-key", JAN)["conversions"], 0)

        self.assertFalse(
            any("journal_mode" in statement.lower() for statement in statements),
            statements,
        )
'''
          if usage_tests.count(anchor) != 1:
              raise SystemExit("could not locate UsageStore test footer")
          usage_tests_path.write_text(usage_tests.replace(anchor, usage_class + anchor, 1), encoding="utf-8")

          bolt_path = Path(".jules/bolt.md")
          bolt_text = bolt_path.read_text(encoding="utf-8").rstrip()
          entry = '''

## 2026-08-07 - Persist SQLite WAL at store initialization
**Learning:** `journal_mode=WAL` is persistent database-file state. Renegotiating it on every short-lived connection adds avoidable lock and I/O work.
**Action:** Establish WAL while creating each store, test the persisted mode through an independent connection, and trace ordinary operations to prevent per-call PRAGMA regressions.
'''
          if "## 2026-08-07 - Persist SQLite WAL at store initialization" not in bolt_text:
              bolt_path.write_text(bolt_text + entry, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog_text = changelog_path.read_text(encoding="utf-8").rstrip()
          bullet = "- JobStore와 UsageStore는 SQLite WAL 모드를 초기화 시 한 번 설정하고 일반 연결에서는 재협상하지 않습니다."
          if bullet not in changelog_text:
              changelog_path.write_text(changelog_text + "\n\n### Changed\n" + bullet + "\n", encoding="utf-8")
          PY

          python3 -m py_compile job_store.py usage_metering.py tests/test_job_store.py tests/test_usage_metering.py
          git diff --check
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python3 -m unittest tests.test_job_store.JobStoreWalInitializationTests -v
          python3 -m unittest tests.test_usage_metering.UsageStoreWalInitializationTests -v
          python3 -m unittest discover -s tests -v

          git add .jules/bolt.md CHANGELOG.md job_store.py usage_metering.py tests/test_job_store.py tests/test_usage_metering.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(sqlite): persist WAL mode at store initialization"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_head}" origin "HEAD:${TARGET_BRANCH}"
