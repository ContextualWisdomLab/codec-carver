name: fuzz

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    # Nightly deeper run (10 minutes/target) at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Coverage-guided fuzzing (Atheris) with a bounded per-target time budget so
  # CI cost stays low. Each target runs independently in the matrix.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - parse_silencedetect
          - parse_probe_payload
          - build_segments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Atheris supports CPython 3.6 - 3.12.
          python-version: "3.12"
      - name: Install Atheris
        run: pip install --require-hashes -r fuzz/requirements-fuzz.txt
      - name: Select time budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=600" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=90" >> "$GITHUB_OUTPUT"
          fi
      - name: Fuzz ${{ matrix.target }}
        run: |
          python fuzz/fuzz_${{ matrix.target }}.py \
            -max_total_time=${{ steps.budget.outputs.seconds }} \
            -timeout=25 \
            -rss_limit_mb=2048 \
            fuzz/corpus/${{ matrix.target }}
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
