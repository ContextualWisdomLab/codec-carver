name: fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly deeper run (10 minutes/target) at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Prove that the one hash lock remains installable in both the product fuzz
  # interpreter and the central OpenCode evidence interpreter.
  fuzz-lock-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the exact Atheris wheel
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r fuzz/requirements-fuzz.txt
          python -c "import atheris; print('Atheris import succeeded')"
          python -m pip check

  # Fast property + regression suite (Hypothesis) — keeps the invariants green
  # on every push without the native fuzzing engine.
  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install --require-hashes -r fuzz/requirements-dev.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  # Coverage-guided fuzzing (Atheris) with a bounded per-target time budget so
  # CI cost stays low. Each target runs independently in the matrix.
  fuzz:
    runs-on: ubuntu-latest
    # LibFuzzer's max_total_time does not bound Python instrumentation/setup.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_silencedetect
          - parse_probe_payload
          - build_segments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Atheris 3.1 supports CPython 3.11-3.14; this bounded fuzz lane uses 3.12.
          python-version: "3.12"
      - name: Install Atheris
        run: "python -m pip install --require-hashes --only-binary=:all: -r fuzz/requirements-fuzz.txt"
      - name: Select time budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=600" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=90" >> "$GITHUB_OUTPUT"
          fi
      - name: Fuzz ${{ matrix.target }}
        run: |
          python fuzz/fuzz_${{ matrix.target }}.py \
            -max_total_time=${{ steps.budget.outputs.seconds }} \
            -timeout=25 \
            -rss_limit_mb=2048 \
            fuzz/corpus/${{ matrix.target }}
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            crash-*
            oom-*
            timeout-*
          if-no-files-found: ignore
