name: Rebuild PR 339 from current main

on:
  push:
    branches:
      - bolt/fastpath-regex-opt-9940470485890630221

permissions:
  contents: write

concurrency:
  group: rebuild-pr-339-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: bolt/fastpath-regex-opt-9940470485890630221

      - name: Rebuild, verify, and publish the minimal fast path
        env:
          TARGET_BRANCH: bolt/fastpath-regex-opt-9940470485890630221
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          summarize_path = Path("summarize.py")
          summarize_text = summarize_path.read_text(encoding="utf-8")
          summarize_old = '        token = _TOKEN_STRIP_RE.sub("", raw).lower()\n'
          summarize_new = (
              '        if raw.isalnum():\n'
              '            token = raw.lower()\n'
              '        else:\n'
              '            token = _TOKEN_STRIP_RE.sub("", raw).lower()\n'
          )
          if summarize_text.count(summarize_old) != 1:
              raise SystemExit("unexpected summarizer tokenization shape")
          summarize_path.write_text(
              summarize_text.replace(summarize_old, summarize_new),
              encoding="utf-8",
          )

          search_path = Path("transcript_search.py")
          search_text = search_path.read_text(encoding="utf-8")
          search_old = '    return _WORD_RE.findall(text.lower())\n'
          search_new = (
              '    lower = text.lower()\n'
              '    if lower.isalnum():\n'
              '        return [lower]\n'
              '    return _WORD_RE.findall(lower)\n'
          )
          if search_text.count(search_old) != 1:
              raise SystemExit("unexpected transcript tokenization shape")
          search_path.write_text(
              search_text.replace(search_old, search_new),
              encoding="utf-8",
          )

          tests_path = Path("tests/test_token_fast_paths.py")
          tests_path.write_text('''"""Equivalence tests for transcript and summary token fast paths."""

from __future__ import annotations

import random
import string
import unittest

import summarize
import transcript_search


def reference_content_words(sentence: str) -> list[str]:
    """Return tokens using the pre-fast-path summarizer algorithm."""

    words: list[str] = []
    for raw in sentence.split():
        token = summarize._TOKEN_STRIP_RE.sub("", raw).lower()
        if token and token not in summarize._STOPWORDS:
            words.append(token)
    return words


def reference_search_tokens(text: str) -> list[str]:
    """Return tokens using the pre-fast-path search algorithm."""

    return transcript_search._WORD_RE.findall(text.lower())


class TokenFastPathEquivalenceTests(unittest.TestCase):
    """Optimized tokenization must remain semantically identical."""

    def test_curated_multilingual_and_punctuation_cases(self) -> None:
        """Representative scripts and punctuation preserve exact output."""

        cases = [
            "Topic123",
            "Résumé42",
            "한글123",
            "東京2026",
            "alpha_beta",
            "can't stop",
            "(wrapped) punctuation!",
            "GreekΑ CyrillicА LatinA",
            "１２３ fullwidth",
            "emoji🙂boundary",
            "the and content",
            "",
        ]
        for text in cases:
            with self.subTest(text=text):
                self.assertEqual(
                    summarize._content_words(text),
                    reference_content_words(text),
                )
                self.assertEqual(
                    transcript_search.tokenize(text),
                    reference_search_tokens(text),
                )

    def test_seeded_randomized_equivalence(self) -> None:
        """A deterministic hostile character mix exercises both branches."""

        rng = random.Random(20260807)
        alphabet = (
            string.ascii_letters
            + string.digits
            + " _-'.,!?/\\\\()[]{}"
            + "éßΑА한글東京１２３🙂"
        )
        for index in range(512):
            text = "".join(
                rng.choice(alphabet) for _ in range(rng.randrange(0, 80))
            )
            with self.subTest(index=index, text=text):
                self.assertEqual(
                    summarize._content_words(text),
                    reference_content_words(text),
                )
                self.assertEqual(
                    transcript_search.tokenize(text),
                    reference_search_tokens(text),
                )


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog_text = changelog_path.read_text(encoding="utf-8").rstrip()
          bullet = "- 순수 영숫자 토큰은 정규식 호출을 건너뛰되 다국어·문장부호 토큰화 결과는 기존 의미와 동일하게 유지합니다."
          if bullet not in changelog_text:
              changelog_path.write_text(
                  changelog_text + "\n\n### Changed\n" + bullet + "\n",
                  encoding="utf-8",
              )

          bolt_path = Path(".jules/bolt.md")
          bolt_text = bolt_path.read_text(encoding="utf-8").rstrip()
          heading = "## 2026-08-07 - Verified token fast paths"
          if heading not in bolt_text:
              bolt_path.write_text(
                  bolt_text
                  + "\n\n"
                  + heading
                  + "\n**Learning:** A regular-expression fast path is safe only when curated multilingual cases and deterministic hostile-input generation prove exact equivalence with the previous algorithm.\n"
                  + "**Action:** Keep fast paths narrow, preserve unrelated comments and behavior, and require equivalence tests before claiming a performance improvement.\n",
                  encoding="utf-8",
              )
          PY

          python3 -m py_compile summarize.py transcript_search.py tests/test_token_fast_paths.py
          git diff --check
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python3 -m unittest tests.test_token_fast_paths -v
          python3 -m unittest discover -s tests -v
          python3 -m interrogate -c pyproject.toml .

          git add .jules/bolt.md CHANGELOG.md summarize.py transcript_search.py tests/test_token_fast_paths.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf(text): add verified token fast paths"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_head}" origin "HEAD:${TARGET_BRANCH}"
