name: Repair PR 361 CI regression

on:
  push:
    branches:
      - fix-hmac-compare-digest-vulnerability-9955538586719757639

permissions:
  contents: write

concurrency:
  group: repair-pr-361-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: fix-hmac-compare-digest-vulnerability-9955538586719757639

      - name: Repair obsolete store test double
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_saas_web.py")
          text = path.read_text(encoding="utf-8")
          old = '''        class RejectingStore:\n            def create(self, *_args, **_kwargs):\n                raise ValueError("duplicate")\n'''
          new = '''        class RejectingStore:\n            def list_jobs(self, *_args, **_kwargs):\n                return []\n\n            def create(self, *_args, **_kwargs):\n                raise ValueError("duplicate")\n'''
          if text.count(old) != 1:
              raise SystemExit("expected RejectingStore test double exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 -m py_compile tests/test_saas_web.py
          rm -f .github/workflows/repair-pr-361.yml
          git diff --check

      - name: Commit and push repair
        run: |
          set -euo pipefail
          git add tests/test_saas_web.py .github/workflows/repair-pr-361.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): preserve result janitor contract in create-failure test"
          git push origin HEAD:fix-hmac-compare-digest-vulnerability-9955538586719757639
