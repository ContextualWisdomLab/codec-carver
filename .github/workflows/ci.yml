name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package (with web + mcp extras)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-index --no-deps --no-build-isolation -e .

      - name: Compile check
        run: python -m py_compile media_shrinker.py config_file.py presets.py saas_web.py mcp_driver.py job_store.py credential_registry.py usage_metering.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify console entry point
        run: codec-carver --help

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0 with rustfmt
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt

      - name: Report Rust toolchain
        run: |
          rustup run 1.88.0 rustc --version --verbose
          rustup run 1.88.0 cargo --version --verbose

      - name: Check Rust formatting
        run: rustup run 1.88.0 cargo fmt --manifest-path rust-core/Cargo.toml -- --check

      - name: Test Rust backend
        run: rustup run 1.88.0 cargo test --locked --all-targets --manifest-path rust-core/Cargo.toml
