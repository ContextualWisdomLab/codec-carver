name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package and hash-pinned quality tooling
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-quality.txt
          python -m pip install --disable-pip-version-check --no-index --no-deps --no-build-isolation -e .

      - name: Compile check
        run: >-
          python -m py_compile
          media_shrinker.py config_file.py presets.py saas_web.py mcp_driver.py
          job_store.py diarize.py speaker_timeline*.py

      - name: Run full tests under branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m unittest discover -s tests -v

      - name: Enforce 100 percent speaker-path line and branch coverage
        run: >-
          python -m coverage report --fail-under=100
          diarize.py speaker_timeline*.py

      - name: Enforce production docstrings on the speaker path
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          missing = []
          for path in [Path("diarize.py"), *sorted(Path.cwd().glob("speaker_timeline*.py"))]:
              raw_path = str(path)
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=raw_path)
              if ast.get_docstring(tree, clean=False) is None:
                  missing.append(f"{raw_path}: module")
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      if ast.get_docstring(node, clean=False) is None:
                          missing.append(f"{raw_path}:{node.lineno}: {node.name}")
          if missing:
              raise SystemExit("Missing docstrings:\n" + "\n".join(missing))
          PY

      - name: Verify console entry points
        run: |
          codec-carver --help
          codec-carver-speakers --help
