name: Apply PR 246 reviewed cleanup fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr246-apply-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: pr246-reviewed-cleanup-fix
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/codec-carver' &&
      github.event.pull_request.number == 246 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'sentinel-dos-fix-tempdir-3116578629236057975'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify expected test-first parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "3b340c25f9bcc8d22bdb1abeaabcadf1a7190766"

      - name: Apply bounded production fix
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("saas_web.py")
          source = path.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  "    if not preprocessed_files:",
                  "        try:",
                  "            temp_dir_path = Path(tempfile.mkdtemp(prefix=\"codec_carver_batch_\"))",
                  "            zip_path = temp_dir_path / \"codec_carver_batch.zip\"",
                  "            with zipfile.ZipFile(zip_path, \"w\", compression=zipfile.ZIP_STORED) as archive:",
                  "                archive.writestr(\"results.json\", json.dumps(manifest, indent=2))",
                  "            return FileResponse(",
                  "                path=zip_path,",
                  "                filename=zip_path.name,",
                  "                media_type=\"application/zip\",",
                  "                background=BackgroundTask(cleanup_temp_dir, temp_dir_path)",
                  "            )",
                  "        except Exception:",
                  "            return JSONResponse(status_code=500, content={\"error\": \"Upload processing failed\"})",
              ]
          ) + "\n"
          new = "\n".join(
              [
                  "    if not preprocessed_files:",
                  "        temp_dir_path: Path | None = None",
                  "        try:",
                  "            temp_dir_path = Path(tempfile.mkdtemp(prefix=\"codec_carver_batch_\"))",
                  "            zip_path = temp_dir_path / \"codec_carver_batch.zip\"",
                  "            with zipfile.ZipFile(zip_path, \"w\", compression=zipfile.ZIP_STORED) as archive:",
                  "                archive.writestr(\"results.json\", json.dumps(manifest, indent=2))",
                  "            return FileResponse(",
                  "                path=zip_path,",
                  "                filename=zip_path.name,",
                  "                media_type=\"application/zip\",",
                  "                background=BackgroundTask(cleanup_temp_dir, temp_dir_path),",
                  "            )",
                  "        except Exception:",
                  "            if temp_dir_path is not None:",
                  "                cleanup_temp_dir(temp_dir_path)",
                  "            logger.exception(\"Failed to build all-invalid batch manifest\")",
                  "            return JSONResponse(status_code=500, content={\"error\": \"Upload processing failed\"})",
              ]
          ) + "\n"
          if source.count(old) != 1:
              raise SystemExit("expected all-invalid batch block was not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile saas_web.py tests/test_sentinel_upload_resource_control.py
          git diff --check

      - name: Install reproducible test dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt

      - name: Verify focused regression
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m unittest discover -s tests -p 'test_sentinel_upload_resource_control.py' -v

      - name: Publish verified code fix and remove one-shot workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git rm .github/workflows/pr246-apply-review-fixes.yml
          changed="$(git diff --name-only HEAD)"
          expected="$(printf '%s\n%s\n' \
            '.github/workflows/pr246-apply-review-fixes.yml' \
            'saas_web.py')"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add saas_web.py
          git commit -m 'fix(security): clean failed invalid-batch workspaces'
          basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic}" \
            push origin HEAD:refs/heads/sentinel-dos-fix-tempdir-3116578629236057975
