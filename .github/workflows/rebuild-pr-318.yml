name: Rebuild PR 318 from current main

on:
  push:
    branches:
      - claude/contextualwisdomlab-audit-governance-qyxe67

permissions:
  contents: write

concurrency:
  group: rebuild-pr-318-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: claude/contextualwisdomlab-audit-governance-qyxe67

      - name: Rebuild a minimal branch from current main
        env:
          TARGET_BRANCH: claude/contextualwisdomlab-audit-governance-qyxe67
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git reset --hard origin/main

          cat > fuzz/requirements-fuzz.in <<'EOF'
          # Atheris 3.1.0 provides wheels for the CPython 3.12 fuzz lane and the
          # newer wheel-only interpreter used by central coverage evidence.
          # Regenerate with:
          # uv pip compile fuzz/requirements-fuzz.in --generate-hashes --python-version 3.12 --universal -o fuzz/requirements-fuzz.txt
          atheris==3.1.0
          EOF
          sed -i 's/^          //' fuzz/requirements-fuzz.in

          cat > fuzz/requirements-fuzz.txt <<'EOF'
          # This file was autogenerated by uv via the following command:
          #    uv pip compile fuzz/requirements-fuzz.in --generate-hashes --python-version 3.12 --universal -o fuzz/requirements-fuzz.txt
          atheris==3.1.0 \
              --hash=sha256:315a0b5c819852b1ffe1ca72efc389c7724881f2c33e4aacb8c6bcec49bd5011 \
              --hash=sha256:ec5e11f21a4c197fe91f7aea2b2de88e623c73a21fc07b105ac6329a1588457b \
              --hash=sha256:f8a9f51ce8369026e8eb7b7174835e8c4c85a1a6db5d9add36c15100779d2a39
              # via -r fuzz/requirements-fuzz.in
          EOF
          sed -i 's/^          //' fuzz/requirements-fuzz.txt

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_saas_web.py")
          text = path.read_text(encoding="utf-8")
          old = '''except ImportError:
    _HAS_FASTAPI = False
'''
          new = '''except ImportError:
    # The optional web integration, or one of its imports, is absent.
    _HAS_FASTAPI = False
except RuntimeError as exc:
    # FastAPI raises RuntimeError when Form/UploadFile routes are imported
    # without python-multipart. Treat only that documented dependency-missing
    # case as an absent optional extra; unrelated initialization failures remain
    # visible and must fail collection.
    if "python-multipart" not in str(exc).lower():
        raise
    _HAS_FASTAPI = False
'''
          if text.count(old) != 1:
              raise SystemExit("could not locate optional web import guard")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cat > tests/test_saas_web_import_guard.py <<'PY'
          """Regression tests for the optional web test-suite import guard."""

          from __future__ import annotations

          import subprocess
          import sys
          import textwrap
          import unittest


          class SaasWebOptionalImportGuardTests(unittest.TestCase):
              """Distinguish an absent python-multipart extra from real failures."""

              @staticmethod
              def _run_with_import_error(message: str) -> subprocess.CompletedProcess[str]:
                  """Execute the test module while forcing one saas_web import failure."""

                  script = textwrap.dedent(
                      f"""
                      import builtins
                      import runpy

                      original_import = builtins.__import__
                      def guarded_import(name, globals=None, locals=None, fromlist=(), level=0):
                          if name == "saas_web":
                              raise RuntimeError({message!r})
                          return original_import(name, globals, locals, fromlist, level)

                      builtins.__import__ = guarded_import
                      namespace = runpy.run_path("tests/test_saas_web.py")
                      assert namespace["_HAS_FASTAPI"] is False
                      """
                  )
                  return subprocess.run(
                      [sys.executable, "-c", script],
                      capture_output=True,
                      text=True,
                      check=False,
                  )

              def test_missing_python_multipart_is_treated_as_optional(self) -> None:
                  """The documented dependency error must make the suite skippable."""

                  completed = self._run_with_import_error(
                      'Form data requires "python-multipart" to be installed.'
                  )
                  self.assertEqual(completed.returncode, 0, completed.stderr)

              def test_unrelated_runtime_error_remains_visible(self) -> None:
                  """An unrelated initialization failure must not be swallowed."""

                  completed = self._run_with_import_error("unrelated startup failure")
                  self.assertNotEqual(completed.returncode, 0)
                  self.assertIn("unrelated startup failure", completed.stderr)


          if __name__ == "__main__":
              unittest.main()
          PY
          sed -i 's/^          //' tests/test_saas_web_import_guard.py

          python3 -m py_compile tests/test_saas_web.py tests/test_saas_web_import_guard.py
          git diff --check
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python3 -m pip install --disable-pip-version-check --require-hashes -r fuzz/requirements-fuzz.txt
          python3 -m unittest tests.test_saas_web_import_guard -v
          python3 -m unittest discover -s tests -v

          git add fuzz/requirements-fuzz.in fuzz/requirements-fuzz.txt tests/test_saas_web.py tests/test_saas_web_import_guard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): distinguish missing optional multipart dependency"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_head}" origin "HEAD:${TARGET_BRANCH}"
