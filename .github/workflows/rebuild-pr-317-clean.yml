name: Rebuild PR 317 as a bounded decoding repair

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: rebuild-pr-317-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'claude/inkspan-pr-audit-ci-q1u4uj'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: claude/inkspan-pr-audit-ci-q1u4uj

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Rebuild from protected current main and verify
        env:
          TARGET_BRANCH: claude/inkspan-pr-audit-ci-q1u4uj
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('media_shrinker.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''            capture_output=True,
            text=True,
            shell=False,
            timeout=timeout,
'''
          new = '''            capture_output=True,
            text=True,
            encoding="utf-8",
            errors="replace",
            shell=False,
            timeout=timeout,
'''
          if source.count(old) != 1:
              raise SystemExit('expected one shared media-tool subprocess boundary')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          Path('tests/test_media_tool_decoding.py').write_text(r'''"""Real subprocess tests for hostile ffmpeg and ffprobe output bytes."""

from __future__ import annotations

import os
import tempfile
import unittest
from pathlib import Path

import media_shrinker
from media_shrinker import MediaShrinkerError, SilenceInterval


@unittest.skipIf(os.name == "nt", "POSIX executable fixtures use a shebang")
class MediaToolDecodingTests(unittest.TestCase):
    """The shared subprocess boundary must decode untrusted bytes tolerantly."""

    def _tool(self, *, stdout: bytes = b"", stderr: bytes = b"", returncode: int = 0) -> str:
        """Create an executable Python tool that emits exact raw byte streams."""
        directory = tempfile.TemporaryDirectory()
        self.addCleanup(directory.cleanup)
        path = Path(directory.name) / "media_tool.py"
        path.write_text(
            "#!/usr/bin/env python3\n"
            "import os\n"
            f"os.write(1, {stdout!r})\n"
            f"os.write(2, {stderr!r})\n"
            f"raise SystemExit({returncode})\n",
            encoding="utf-8",
        )
        path.chmod(0o700)
        return str(path)

    def test_shared_runner_replaces_invalid_stdout_and_stderr(self) -> None:
        """Invalid bytes become U+FFFD without changing exit status."""
        completed = media_shrinker._run_media_tool(
            [self._tool(stdout=b"value\xff", stderr=b"warning\xfe")],
            tool="fixture",
            timeout=30,
        )
        self.assertEqual(completed.returncode, 0)
        self.assertEqual(completed.stdout, "value\ufffd")
        self.assertEqual(completed.stderr, "warning\ufffd")

    def test_probe_media_parses_json_with_legacy_encoded_tag(self) -> None:
        """A bad metadata byte cannot prevent parsing valid ffprobe structure."""
        payload = (
            b'{"format":{"duration":"2.5","size":"4",'
            b'"format_name":"wav","tags":{"title":"caf\xff"}},'
            b'"streams":[{"codec_type":"audio","codec_name":"pcm_s16le",'
            b'"bit_rate":"128000"}]}'
        )
        probe = media_shrinker.probe_media(
            Path("source.wav"),
            ffprobe_path=self._tool(stdout=payload),
            source_size=4,
        )
        self.assertEqual(probe.duration_seconds, 2.5)
        self.assertEqual(probe.size_bytes, 4)
        self.assertEqual(probe.audio_codec, "pcm_s16le")
        self.assertFalse(probe.has_video)

    def test_silence_detection_preserves_ascii_markers(self) -> None:
        """Replacement decoding leaves silencedetect timestamps parseable."""
        stderr = (
            b"Metadata title: caf\xff\xfe\n"
            b"silence_start: 100.0\n"
            b"silence_end: 160.5 | silence_duration: 60.5\n"
        )
        intervals = media_shrinker.detect_silence_intervals(
            Path("source.wav"),
            ffmpeg_path=self._tool(stderr=stderr),
        )
        self.assertEqual(
            intervals,
            [SilenceInterval(start_seconds=100.0, end_seconds=160.5)],
        )

    def test_nonzero_error_remains_a_typed_media_error(self) -> None:
        """Nonzero execution is reported as MediaShrinkerError, not decode failure."""
        with self.assertRaises(MediaShrinkerError) as raised:
            media_shrinker.probe_media(
                Path("source.wav"),
                ffprobe_path=self._tool(stderr=b"bad\xffmetadata", returncode=7),
                source_size=4,
            )
        self.assertIn("ffprobe failed", str(raised.exception))
        self.assertIn("bad\ufffdmetadata", str(raised.exception))


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          doctoring = Path('docs/doctoring/media-tool-output-decoding.md')
          doctoring.parent.mkdir(parents=True, exist_ok=True)
          doctoring.write_text('''# Media-tool output decoding boundary

## Decision

Codec Carver decodes stdout and stderr from the shared ffmpeg/ffprobe subprocess boundary explicitly as UTF-8 with replacement for malformed byte sequences. Media metadata is attacker-influenceable and frequently contains legacy encodings. A decoding exception must not escape before the JSON or silencedetect parser examines the valid ASCII structure.

Replacement is deliberately narrower than accepting arbitrary malformed media. Command arguments, protocol allowlists, `shell=False`, timeouts, missing-executable handling, return codes, JSON shape validation, numeric validation, and executable/path trust boundaries remain unchanged. Undecodable metadata bytes become U+FFFD; raw bytes are never reflected in user-facing errors.

## Verification and rollback

Real executable fixtures emit invalid bytes to stdout and stderr. Tests cover the shared runner, ffprobe JSON containing a legacy-encoded tag, silencedetect output with valid timestamps beside invalid metadata, and a nonzero typed error. The existing suite continues to cover timeout and missing executable behavior.

Rollback may select another explicit bounded decoding policy, but must never restore implicit locale decoding or strict UTF-8 exceptions at this boundary.

## References

Python Software Foundation. (2026). *subprocess — Subprocess management* (Python 3.14 documentation). https://docs.python.org/3.14/library/subprocess.html

The Unicode Consortium. (2025). *The Unicode Standard, Version 17.0.0*. https://www.unicode.org/versions/Unicode17.0.0/

FFmpeg Project. (2026). *FFmpeg documentation*. https://ffmpeg.org/ffmpeg.html
''', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8').rstrip()
          bullet = '- ffmpeg·ffprobe의 비 UTF-8 메타데이터 출력을 공유 subprocess 경계에서 replacement decoding하여 유효한 미디어 처리가 `UnicodeDecodeError`로 중단되지 않도록 수정했습니다.'
          if bullet not in text:
              if '\n### Fixed\n' in text:
                  text = text.replace('\n### Fixed\n', '\n### Fixed\n' + bullet + '\n', 1)
              else:
                  text += '\n\n### Fixed\n' + bullet
              changelog.write_text(text + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/rebuild-pr-317-clean.yml
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt
          python -m py_compile media_shrinker.py tests/test_media_tool_decoding.py
          python -m unittest tests.test_media_tool_decoding -v
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=100
          python -m interrogate -c pyproject.toml .
          git diff --check

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(media): tolerate non-UTF-8 tool metadata'
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_head}" origin "HEAD:${TARGET_BRANCH}"
