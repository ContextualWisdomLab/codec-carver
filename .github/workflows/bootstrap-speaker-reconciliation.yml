name: Bootstrap speaker reconciliation change set

on:
  push:
    branches: ["agent/speaker-timeline-reconciliation"]

permissions:
  contents: write

concurrency:
  group: bootstrap-speaker-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_URL: https://at.adobe.com/1t5XdQtDT5rep5fN
      PAYLOAD_SHA256: cf1cd0175a32927f63afd6c9ea640ec3a84b3f964c614382e0761cea536d6ae0
      PAYLOAD_PATH: ${{ runner.temp }}/codec-carver-speaker-reconciliation-payload.zip
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify immutable payload
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 4 --retry-all-errors \
            --output "$PAYLOAD_PATH" "$PAYLOAD_URL"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$PAYLOAD_PATH" | sha256sum --check --strict

      - name: Materialize declared files safely
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import tempfile
          import zipfile

          archive_path = Path(os.environ["PAYLOAD_PATH"])
          repository = Path.cwd().resolve()
          manifest_name = ".payload-manifest.json"

          with zipfile.ZipFile(archive_path) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("payload ZIP failed CRC validation")
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("payload ZIP contains duplicate paths")
              if manifest_name not in names:
                  raise SystemExit("payload manifest is missing")
              manifest = json.loads(archive.read(manifest_name))
              if manifest.get("schema_version") != "codec-carver/bootstrap-payload/v1":
                  raise SystemExit("payload schema version is not supported")
              declared = manifest.get("files")
              if not isinstance(declared, dict) or not declared:
                  raise SystemExit("payload manifest has no declared files")
              expected_names = set(declared) | {manifest_name}
              if set(names) != expected_names:
                  raise SystemExit("payload contains undeclared or missing files")

              for relative_name, expected_digest in sorted(declared.items()):
                  if not isinstance(relative_name, str) or not isinstance(expected_digest, str):
                      raise SystemExit("payload manifest entry has an invalid type")
                  relative_path = PurePosixPath(relative_name)
                  if relative_path.is_absolute() or ".." in relative_path.parts:
                      raise SystemExit(f"unsafe payload path: {relative_name}")
                  info = archive.getinfo(relative_name)
                  file_type = (info.external_attr >> 16) & 0o170000
                  if file_type not in {0, 0o100000}:
                      raise SystemExit(f"non-regular payload entry: {relative_name}")
                  content = archive.read(relative_name)
                  actual_digest = hashlib.sha256(content).hexdigest()
                  if actual_digest != expected_digest:
                      raise SystemExit(f"SHA-256 mismatch: {relative_name}")
                  destination = (repository / Path(*relative_path.parts)).resolve()
                  if repository not in destination.parents:
                      raise SystemExit(f"payload escaped repository: {relative_name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  descriptor, temporary_name = tempfile.mkstemp(
                      prefix=f".{destination.name}.", dir=destination.parent
                  )
                  try:
                      with os.fdopen(descriptor, "wb") as handle:
                          handle.write(content)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temporary_name, destination)
                  finally:
                      try:
                          os.unlink(temporary_name)
                      except FileNotFoundError:
                          pass
          PY

      - name: Verify materialized change set
        run: |
          set -euo pipefail
          python -m py_compile diarize.py speaker_timeline.py speaker_timeline_cli.py
          python -m unittest discover -s tests -p 'test_diarize_v2.py' -v
          python -m unittest discover -s tests -p 'test_speaker_timeline*.py' -v
          python speaker_timeline_cli.py --help >/dev/null
          git diff --check

      - name: Commit materialized files and remove bootstrap
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-speaker-reconciliation.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No payload changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(speakers): reconcile long-form diarized transcripts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
